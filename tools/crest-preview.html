<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herby klubów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/styles/tokens.css">
<link rel="stylesheet" href="../src/styles/base.css">
<style>
  main { max-width: 1100px; margin: 0 auto; padding: var(--space-4); }
  section { margin-bottom: var(--space-5); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  li { display: flex; align-items: center; gap: var(--space-3); min-height: 56px; padding: var(--space-2) var(--space-3); }
  li .meta { font-size: var(--step--1); color: var(--text-muted); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: var(--step-1); line-height: 1.1; }
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
  import { CLUBS_PL, LEAGUE_NAMES } from '../src/data/clubs_pl.js';
  import { crestHtml, CRESTS_AVAILABLE } from '../src/ui/crest.js';
  const byId = new Map(CLUBS_PL.map((c) => [c.id, c]));
  const app = document.getElementById('app');
  let html = '<h1>Herby klubów 2026/27</h1>';
  for (const tier of [1, 2, 3]) {
    const list = CLUBS_PL.filter((c) => c.tier === tier);
    html += `<section><h2>${LEAGUE_NAMES[tier]}</h2><ol class="stripes">`;
    for (const c of list) {
      const src = c.parent ? 'herb pierwszej drużyny' : (CRESTS_AVAILABLE.has(c.id) ? 'prawdziwy herb' : 'tarcza zastępcza');
      html += `<li>${crestHtml(c, { size: 40, base: '../assets/crests', clubsById: byId })}<div><div class="name">${c.name}</div><div class="meta">L ${c.L.toFixed(1)}, ${src}</div></div></li>`;
    }
    html += '</ol></section>';
  }
  app.innerHTML = html;
  document.body.dataset.ready = '1';
</script>
</body>
</html>
